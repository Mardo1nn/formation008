<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Institute - Centre de Formation Professionnelle</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/poppins@5.0.8/index.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: #fff;
            color: #333;
        }

        :root {
            --brown-dark: #3d2415;
            --brown-main: #6b3a2a;
            --brown-light: #8b5a3c;
            --brown-lighter: #c49a6c;
            --cream: #fdf6f0;
            --white: #ffffff;
            --gold: #d4a574;
            --gold-light: #e8c9a0;
        }

        /* Marquee */
        .marquee-container {
            background: linear-gradient(90deg, var(--brown-dark), var(--brown-main));
            color: var(--gold);
            padding: 12px 0;
            overflow: hidden;
            white-space: nowrap;
            position: relative;
            border-bottom: 2px solid var(--gold);
        }

        .marquee-text {
            display: inline-block;
            animation: marquee 30s linear infinite;
            font-size: 14px;
            font-weight: 500;
        }

        @keyframes marquee {
            0% { transform: translateX(100vw); }
            100% { transform: translateX(-100%); }
        }

        /* Header */
        header {
            background: var(--white);
            box-shadow: 0 4px 20px rgba(74,44,23,0.15);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .header-content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 18px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            width: 55px;
            height: 55px;
            background: linear-gradient(135deg, var(--brown-main), var(--gold));
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 26px;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(107,58,42,0.3);
        }

        .logo-text h1 {
            font-size: 24px;
            color: var(--brown-dark);
            font-weight: 700;
        }

        .logo-text p {
            font-size: 11px;
            color: var(--brown-light);
            font-weight: 500;
        }

        nav {
            display: flex;
            gap: 28px;
            align-items: center;
        }

        nav a {
            text-decoration: none;
            color: var(--brown-dark);
            font-weight: 500;
            font-size: 15px;
            transition: color 0.3s;
            position: relative;
        }

        nav a:hover {
            color: var(--brown-light);
        }

        nav a::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 0;
            height: 2px;
            background: var(--gold);
            transition: width 0.3s;
        }

        nav a:hover::after {
            width: 100%;
        }

        .btn {
            padding: 12px 28px;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 14px;
            text-decoration: none;
            display: inline-block;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--brown-main), var(--brown-light));
            color: white;
            box-shadow: 0 4px 15px rgba(107,58,42,0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(107,58,42,0.4);
        }

        .btn-outline {
            background: transparent;
            border: 2px solid var(--brown-main);
            color: var(--brown-main);
        }

        .btn-outline:hover {
            background: var(--brown-main);
            color: white;
        }

        /* Hero */
        .hero {
            background: linear-gradient(135deg, var(--brown-dark) 0%, var(--brown-main) 50%, var(--brown-light) 100%);
            padding: 100px 20px;
            text-align: center;
            color: white;
            position: relative;
            overflow: hidden;
        }

        .hero::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="2" fill="rgba(255,255,255,0.05)"/></svg>') repeat;
            background-size: 30px 30px;
        }

        .hero::after {
            content: '';
            position: absolute;
            top: -50%;
            right: -20%;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(212,165,116,0.2) 0%, transparent 70%);
            border-radius: 50%;
        }

        .hero-content {
            max-width: 900px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        .hero h2 {
            font-size: 52px;
            margin-bottom: 25px;
            font-weight: 700;
            line-height: 1.2;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.3);
        }

        .hero p {
            font-size: 20px;
            margin-bottom: 35px;
            opacity: 0.95;
            line-height: 1.6;
        }

        .hero-buttons {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn-hero {
            padding: 16px 36px;
            background: white;
            color: var(--brown-dark);
            border-radius: 12px;
            font-weight: 600;
            font-size: 17px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.2);
        }

        .btn-hero:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 35px rgba(0,0,0,0.3);
        }

        .btn-hero-outline {
            padding: 16px 36px;
            background: transparent;
            border: 2px solid white;
            color: white;
            border-radius: 12px;
            font-weight: 600;
            font-size: 17px;
        }

        .btn-hero-outline:hover {
            background: white;
            color: var(--brown-dark);
        }

        /* Sections */
        section {
            padding: 90px 20px;
        }

        .section-title {
            text-align: center;
            margin-bottom: 60px;
        }

        .section-title h2 {
            font-size: 40px;
            color: var(--brown-dark);
            margin-bottom: 15px;
            font-weight: 700;
        }

        .section-title p {
            color: var(--brown-light);
            font-size: 17px;
        }

        .section-title .line {
            width: 80px;
            height: 4px;
            background: linear-gradient(90deg, var(--brown-main), var(--gold));
            margin: 20px auto;
            border-radius: 2px;
        }

        /* Objectifs */
        .objectifs {
            background: var(--cream);
        }

        .objectifs-grid {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 35px;
        }

        .objectif-card {
            background: white;
            padding: 35px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 8px 25px rgba(74,44,23,0.1);
            transition: all 0.3s;
            border: 2px solid transparent;
        }

        .objectif-card:hover {
            transform: translateY(-8px);
            border-color: var(--gold-light);
            box-shadow: 0 15px 40px rgba(74,44,23,0.15);
        }

        .objectif-icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, var(--brown-main), var(--gold));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 25px;
            color: white;
            font-size: 32px;
            box-shadow: 0 6px 20px rgba(107,58,42,0.3);
        }

        .objectif-card h3 {
            color: var(--brown-dark);
            margin-bottom: 12px;
            font-size: 20px;
            font-weight: 600;
        }

        .objectif-card p {
            color: #666;
            font-size: 15px;
            line-height: 1.7;
        }

        /* Catalogue */
        .catalogue {
            max-width: 1300px;
            margin: 0 auto;
        }

        .formations-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
            gap: 35px;
        }

        .formation-card {
            background: white;
            border-radius: 25px;
            overflow: hidden;
            box-shadow: 0 8px 30px rgba(74,44,23,0.12);
            transition: all 0.4s;
            border: 2px solid transparent;
        }

        .formation-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 20px 50px rgba(74,44,23,0.2);
            border-color: var(--gold-light);
        }

        .formation-image {
            height: 220px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 70px;
            position: relative;
            overflow: hidden;
        }

        .formation-image::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(0,0,0,0.1), rgba(0,0,0,0.3));
        }

        .formation-image i {
            position: relative;
            z-index: 1;
            filter: drop-shadow(2px 2px 8px rgba(0,0,0,0.3));
        }

        .formation-badge {
            position: absolute;
            top: 20px;
            right: 20px;
            background: var(--gold);
            color: var(--brown-dark);
            padding: 8px 16px;
            border-radius: 25px;
            font-size: 13px;
            font-weight: 700;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            z-index: 2;
        }

        .formation-content {
            padding: 30px;
        }

        .formation-content h3 {
            color: var(--brown-dark);
            font-size: 22px;
            margin-bottom: 12px;
            font-weight: 700;
        }

        .formation-content p {
            color: #666;
            font-size: 15px;
            margin-bottom: 18px;
            line-height: 1.6;
        }

        .formation-details {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }

        .formation-detail {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 14px;
            color: #555;
        }

        .formation-detail i {
            color: var(--brown-light);
            width: 18px;
            font-size: 16px;
        }

        .formation-price {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 20px;
            border-top: 2px solid #f0f0f0;
        }

        .price-info {
            display: flex;
            flex-direction: column;
        }

        .price-info span {
            font-size: 12px;
            color: #999;
            font-weight: 500;
        }

        .price-info strong {
            color: var(--brown-dark);
            font-size: 20px;
            font-weight: 700;
        }

        .btn-inscription {
            padding: 12px 24px;
            background: linear-gradient(135deg, var(--brown-main), var(--brown-light));
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 14px;
            box-shadow: 0 4px 15px rgba(107,58,42,0.3);
        }

        .btn-inscription:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(107,58,42,0.4);
        }

        /* Témoignages */
        .temoignages {
            background: var(--cream);
        }

        .temoignages-grid {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 35px;
        }

        .temoignage-card {
            background: white;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 8px 25px rgba(74,44,23,0.1);
            transition: all 0.3s;
        }

        .temoignage-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(74,44,23,0.15);
        }

        .temoignage-header {
            display: flex;
            align-items: center;
            gap: 18px;
            margin-bottom: 18px;
        }

        .temoignage-avatar {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, var(--brown-main), var(--gold));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 20px;
            box-shadow: 0 4px 15px rgba(107,58,42,0.3);
        }

        .temoignage-info h4 {
            color: var(--brown-dark);
            font-size: 18px;
            font-weight: 600;
        }

        .temoignage-info span {
            color: var(--brown-light);
            font-size: 13px;
        }

        .temoignage-stars {
            color: var(--gold);
            margin-bottom: 12px;
            font-size: 18px;
        }

        .temoignage-card p {
            color: #555;
            font-size: 15px;
            line-height: 1.7;
            font-style: italic;
        }

        /* Contact */
        .contact {
            max-width: 1200px;
            margin: 0 auto;
        }

        .contact-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 35px;
        }

        .contact-card {
            text-align: center;
            padding: 35px;
            background: var(--cream);
            border-radius: 20px;
            transition: all 0.3s;
            border: 2px solid transparent;
        }

        .contact-card:hover {
            transform: translateY(-5px);
            border-color: var(--gold-light);
            box-shadow: 0 10px 30px rgba(74,44,23,0.1);
        }

        .contact-card i {
            font-size: 42px;
            color: var(--brown-main);
            margin-bottom: 18px;
        }

        .contact-card h4 {
            color: var(--brown-dark);
            margin-bottom: 10px;
            font-size: 18px;
            font-weight: 600;
        }

        .contact-card p {
            color: #666;
            font-size: 15px;
        }

        /* Footer */
        footer {
            background: linear-gradient(135deg, var(--brown-dark), var(--brown-main));
            color: white;
            padding: 50px 20px 25px;
        }

        .footer-content {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 40px;
            margin-bottom: 40px;
        }

        .footer-section h4 {
            margin-bottom: 18px;
            color: var(--gold);
            font-size: 18px;
            font-weight: 600;
        }

        .footer-section p, .footer-section a {
            color: rgba(255,255,255,0.8);
            font-size: 15px;
            line-height: 2;
            text-decoration: none;
            display: block;
            transition: color 0.3s;
        }

        .footer-section a:hover {
            color: var(--gold);
        }

        .footer-bottom {
            text-align: center;
            padding-top: 25px;
            border-top: 1px solid rgba(255,255,255,0.2);
            color: rgba(255,255,255,0.6);
            font-size: 14px;
        }

        /* Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.7);
            z-index: 2000;
            align-items: center;
            justify-content: center;
            padding: 20px;
            backdrop-filter: blur(5px);
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: white;
            border-radius: 25px;
            padding: 45px;
            max-width: 550px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        .modal-close {
            position: absolute;
            top: 20px;
            right: 25px;
            font-size: 28px;
            cursor: pointer;
            color: #999;
            background: none;
            border: none;
            transition: color 0.3s;
        }

        .modal-close:hover {
            color: var(--brown-dark);
        }

        .modal h2 {
            color: var(--brown-dark);
            margin-bottom: 25px;
            font-size: 28px;
            font-weight: 700;
        }

        .form-group {
            margin-bottom: 22px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--brown-dark);
            font-weight: 600;
            font-size: 14px;
        }

        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 14px 18px;
            border: 2px solid #e8e8e8;
            border-radius: 12px;
            font-size: 15px;
            font-family: 'Poppins', sans-serif;
            transition: all 0.3s;
        }

        .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
            outline: none;
            border-color: var(--brown-main);
            box-shadow: 0 0 0 3px rgba(107,58,42,0.1);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 90px;
        }

        .form-submit {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, var(--brown-main), var(--brown-light));
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 17px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(107,58,42,0.3);
        }

        .form-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(107,58,42,0.4);
        }

        .form-switch {
            text-align: center;
            margin-top: 18px;
            font-size: 15px;
            color: #666;
        }

        .form-switch a {
            color: var(--brown-main);
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
        }

        /* Payment Info */
        .payment-info {
            background: linear-gradient(135deg, var(--cream), #fff);
            border: 2px solid var(--gold-light);
            border-radius: 15px;
            padding: 20px;
            margin: 20px 0;
        }

        .payment-info h4 {
            color: var(--brown-dark);
            margin-bottom: 12px;
            font-size: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .payment-details {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .payment-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            background: white;
            border-radius: 10px;
            border: 1px solid #e8e8e8;
        }

        .payment-item-label {
            font-weight: 600;
            color: var(--brown-dark);
            font-size: 14px;
        }

        .payment-item-value {
            font-weight: 700;
            color: var(--brown-main);
            font-size: 16px;
            font-family: monospace;
        }

        /* Dashboard */
        .dashboard-page {
            display: none;
            min-height: 100vh;
            background: var(--cream);
        }

        .dashboard-page.active {
            display: block;
        }

        .dashboard-header {
            background: white;
            padding: 18px 20px;
            box-shadow: 0 4px 20px rgba(74,44,23,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .dashboard-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 35px 20px;
        }

        .dashboard-welcome {
            background: linear-gradient(135deg, var(--brown-main), var(--gold));
            color: white;
            padding: 35px;
            border-radius: 25px;
            margin-bottom: 35px;
            box-shadow: 0 8px 30px rgba(107,58,42,0.2);
        }

        .dashboard-welcome h2 {
            font-size: 32px;
            margin-bottom: 8px;
            font-weight: 700;
        }

        .dashboard-welcome p {
            opacity: 0.95;
            font-size: 16px;
        }

        .dashboard-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 25px;
            margin-bottom: 35px;
        }

        .stat-card {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 8px 25px rgba(74,44,23,0.1);
            transition: all 0.3s;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(74,44,23,0.15);
        }

        .stat-card i {
            font-size: 36px;
            color: var
